
<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela izmišljenih podataka</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f6f8;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid #bdc3c7;
            padding: 15px;
            text-align: center;
        }

        th {
            background-color: #2980b9;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #ecf0f1;
        }

        tr:hover {
            background-color: #d6eaf8;
        }
    </style>
</head>

<body>

    <h2>Podaci o izmišljenim osobama</h2>

    <table>
        <tr>
            <th>Ime</th>
            <th>Prezime</th>
            <th>Grad</th>
            <th>Automobil</th>
            <th>Hobi</th>
        </tr>

        <tr>
            <td>Marko</td>
            <td>Petrović</td>
            <td>Tuzla</td>
            <td>Volkswagen Passat</td>
            <td>Fudbal</td>
        </tr>

        <tr>
            <td>Amna</td>
            <td>Hadžić</td>
            <td>Sarajevo</td>
            <td>BMW Serija 3</td>
            <td>Fotografija</td>
        </tr>

        <tr>
            <td>Adnan</td>
            <td>Kovačević</td>
            <td>Zenica</td>
            <td>Golf 7</td>
            <td>Videoigre</td>
        </tr>

        <tr>
            <td>Lejla</td>
            <td>Alić</td>
            <td>Mostar</td>
            <td>Audi A4</td>
            <td>Putovanja</td>
        </tr>
    </table>

</body>
</html>
